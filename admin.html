<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Portfolio Control Center</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body>
    <header class="admin-header">
      <a class="admin-brand" href="/" aria-label="Return to portfolio">
        <span class="admin-mark" aria-hidden="true">ML</span>
        <span>
          <strong>Portfolio Control Center</strong>
          <small>Owner workspace</small>
        </span>
      </a>
      <div class="admin-header-actions">
        <span class="system-state"><i aria-hidden="true"></i><span id="system-state">Locked</span></span>
        <button class="icon-button" id="sign-out" type="button" title="Sign out" aria-label="Sign out" hidden>↗</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="auth-panel" id="auth-panel" aria-labelledby="auth-title">
        <p class="eyebrow">Restricted</p>
        <h1 id="auth-title">Owner authentication</h1>
        <p class="auth-status" id="auth-status">Checking admin configuration…</p>
        <form id="owner-login" hidden>
          <div id="remote-fields">
            <label for="owner-email">Email</label>
            <input id="owner-email" name="email" type="email" autocomplete="username">
            <label for="owner-password">Password</label>
            <input id="owner-password" name="password" type="password" autocomplete="current-password">
          </div>
          <div id="local-fields" hidden>
            <label for="local-token">Local owner token</label>
            <input id="local-token" name="localToken" type="password" autocomplete="off">
          </div>
          <button class="primary-action" type="submit">Sign in</button>
        </form>
      </section>

      <section class="admin-workspace" id="admin-workspace" hidden aria-labelledby="workspace-title">
        <div class="workspace-heading">
          <div>
            <p class="eyebrow">Runtime control plane</p>
            <h1 id="workspace-title">Feature availability</h1>
          </div>
          <div class="owner-identity">
            <small>Authenticated owner</small>
            <strong id="owner-label"></strong>
          </div>
        </div>

        <div class="workspace-tabs" role="tablist" aria-label="Control Center views">
          <button id="flags-tab" type="button" role="tab" aria-selected="true" aria-controls="flags-panel">Flags</button>
          <button id="audit-tab" type="button" role="tab" aria-selected="false" aria-controls="audit-panel" tabindex="-1">Audit</button>
        </div>

        <div class="environment-bar">
          <div class="segmented-control" role="group" aria-label="Configuration environment">
            <button type="button" data-environment="development">Development</button>
            <button type="button" data-environment="staging">Staging</button>
            <button type="button" data-environment="production">Production</button>
          </div>
          <button class="icon-button" id="refresh-config" type="button" title="Refresh configuration" aria-label="Refresh configuration">↻</button>
        </div>

        <div class="environment-notice" id="environment-notice" role="status"></div>

        <section class="flag-section" id="flags-panel" role="tabpanel" aria-labelledby="flags-tab">
          <div class="section-heading">
            <div>
              <h2 id="flags-title">Flags</h2>
              <p id="flag-source"></p>
            </div>
            <label class="search-control" for="flag-search">
              <span>Filter</span>
              <input id="flag-search" type="search" placeholder="Search flags">
            </label>
          </div>
          <div class="flag-list" id="flag-list" aria-live="polite"></div>
        </section>

        <section class="audit-section" id="audit-panel" role="tabpanel" aria-labelledby="audit-tab" hidden>
          <div class="section-heading">
            <div>
              <h2 id="audit-title">Audit history</h2>
              <p>Latest environment changes</p>
            </div>
          </div>
          <div class="audit-list" id="audit-list"></div>
        </section>
      </section>
    </main>

    <div class="toast" id="admin-toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>
